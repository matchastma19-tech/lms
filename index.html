<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Space</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="grid-floor" aria-hidden="true"></div>
<div id="root"></div>
<div id="toasts" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script>
/* Live background: falling pixel stars (same as the portfolio) */
(()=>{const cv=document.getElementById('stars'),ctx=cv.getContext('2d');let st=[];
const rs=()=>{cv.width=innerWidth;cv.height=innerHeight;st=Array.from({length:Math.floor(innerWidth/8)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,s:Math.random()<.15?4:2,v:.1+Math.random()*.5,t:Math.random()*6.28,c:['#ffffff','#ffd84d','#46f0a8','#ff5fb2'][Math.floor(Math.random()*4)]}))};
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function draw(){ctx.clearRect(0,0,cv.width,cv.height);const g=ctx.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,'#0a0a23');g.addColorStop(1,'#1d1050');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
 for(const s of st){if(!still){s.t+=.03;s.y+=s.v;if(s.y>cv.height){s.y=0;s.x=Math.random()*cv.width}}ctx.globalAlpha=.5+Math.sin(s.t)*.5;ctx.fillStyle=s.c;ctx.fillRect(Math.round(s.x),Math.round(s.y),s.s,s.s)}
 ctx.globalAlpha=1;if(!still)requestAnimationFrame(draw)}
addEventListener('resize',()=>{rs();if(still)draw()});rs();draw()})();
</script>
<script src="app.js"></script>
</body>
</html>
